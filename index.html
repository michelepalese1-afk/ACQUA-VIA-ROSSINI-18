<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ripartizione Bolletta Acqua</title>
  <!-- Tailwind CSS per la grafica responsive -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librerie per esportazione PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-100 p-4 font-sans text-gray-800">
  <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md space-y-6">
    <h1 class="text-2xl font-bold text-blue-600 text-center">Ripartizione Bolletta Acqua</h1>
    
    <!-- Input Bolletta -->
    <div class="border-b pb-4 space-y-3">
      <h2 class="text-lg font-semibold text-gray-700">1. Dati Bolletta Generale</h2>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-gray-500">Importo Bolletta (€)</label>
          <input type="number" id="importoBolletta" step="0.01" class="w-full border rounded p-2 mt-1" placeholder="es. 150.50">
        </div>
        <div>
          <label class="block text-xs text-gray-500">Periodo / Mese</label>
          <input type="text" id="periodo" class="w-full border rounded p-2 mt-1" placeholder="es. Q1 2026">
        </div>
      </div>
      <div>
        <label class="block text-xs text-gray-500">Lettura Contatore Generale (m³)</label>
        <div class="flex gap-2 mt-1">
          <input type="number" id="genPrec" placeholder="Precedente" class="w-1/2 border rounded p-2 text-sm bg-gray-50">
          <input type="number" id="genAtt" placeholder="Attuale" class="w-1/2 border rounded p-2 text-sm">
        </div>
      </div>
      <div>
        <label class="block text-xs text-gray-500">IBAN per il pagamento (opzionale)</label>
        <input type="text" id="iban" class="w-full border rounded p-2 mt-1 text-sm uppercase" placeholder="IT00X0000000000000000000000">
      </div>
    </div>

    <!-- Input Letture Famiglie -->
    <div class="border-b pb-4 space-y-3">
      <h2 class="text-lg font-semibold text-gray-700">2. Letture Sotto-contatori (m³)</h2>
      <div class="space-y-3">
        <!-- Michele -->
        <div class="space-y-1">
          <input type="text" id="nomeF1" value="Michele" class="w-full border-b font-medium text-sm text-blue-800 bg-transparent focus:outline-none focus:border-blue-500">
          <div class="flex items-center space-x-2">
            <input type="number" id="f1Prec" placeholder="Lettura Precedente" class="w-1/2 border rounded p-2 text-sm bg-gray-50">
            <input type="number" id="f1Att" placeholder="Lettura Attuale" class="w-1/2 border rounded p-2 text-sm">
          </div>
        </div>

        <!-- Simona -->
        <div class="space-y-1">
          <input type="text" id="nomeF2" value="Simona" class="w-full border-b font-medium text-sm text-blue-800 bg-transparent focus:outline-none focus:border-blue-500">
          <div class="flex items-center space-x-2">
            <input type="number" id="f2Prec" placeholder="Lettura Precedente" class="w-1/2 border rounded p-2 text-sm bg-gray-50">
            <input type="number" id="f2Att" placeholder="Lettura Attuale" class="w-1/2 border rounded p-2 text-sm">
          </div>
        </div>

        <!-- Elsa -->
        <div class="space-y-1">
          <input type="text" id="nomeF3" value="Elsa" class="w-full border-b font-medium text-sm text-blue-800 bg-transparent focus:outline-none focus:border-blue-500">
          <div class="flex items-center space-x-2">
            <input type="number" id="f3Prec" placeholder="Lettura Precedente" class="w-1/2 border rounded p-2 text-sm bg-gray-50">
            <input type="number" id="f3Att" placeholder="Lettura Attuale" class="w-1/2 border rounded p-2 text-sm">
          </div>
        </div>
      </div>
    </div>

    <button onclick="calcolaERagruppa()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow">
      Calcola e Salva Ripartizione
    </button>

    <!-- Risultato del Calcolo -->
    <div id="areaRisultato" class="hidden bg-gray-50 p-4 rounded-lg border space-y-3">
      <div id="contenutoPDF" class="bg-white p-4 rounded border">
        <h3 class="font-bold text-gray-700 border-b pb-1">Risultato Calcolo <span id="resPeriodo"></span></h3>
        <p class="text-xs text-gray-500 mt-1" id="resDifferenza"></p>
        <ul class="space-y-2 text-sm mt-3" id="listaQuote"></ul>
      </div>

      <!-- Pulsanti Azione -->
      <div class="grid grid-cols-1 gap-2 pt-2">
        <button onclick="condividiWhatsApp(true)" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold py-2.5 rounded transition flex items-center justify-center gap-1 shadow">
          📲 Invia Report Dettagliato su WhatsApp
        </button>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <button onclick="condividiWhatsApp(false)" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-semibold py-2 rounded transition flex items-center justify-center gap-1">
            💬 Sintesi Quote WhatsApp
          </button>
          <button onclick="scaricaPDF()" class="w-full bg-green-600 hover:bg-green-700 text-white text-sm font-semibold py-2 rounded transition flex items-center justify-center gap-1">
            📄 Scarica Report PDF
          </button>
        </div>
      </div>
    </div>

    <!-- Storico Calcoli -->
    <div class="border-t pt-4">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg font-semibold text-gray-700">Storico Ripartizioni</h2>
        <button onclick="cancellaTuttoStorico()" class="text-xs text-red-600 hover:text-red-800 underline">
          Svuota tutto
        </button>
      </div>
      <div id="listaStorico" class="space-y-2 text-sm max-h-48 overflow-y-auto"></div>
    </div>
  </div>

  <script>
    let ultimoCalcolo = null;

    // Al caricamento, carica IBAN e le eventuali letture precedenti salvate
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('iban').value = localStorage.getItem('ibanAcqua') || '';
      
      const letture = JSON.parse(localStorage.getItem('lettureAcqua') || '{}');
      if (letture.f1 !== undefined) document.getElementById('f1Prec').value = letture.f1;
      if (letture.f2 !== undefined) document.getElementById('f2Prec').value = letture.f2;
      if (letture.f3 !== undefined) document.getElementById('f3Prec').value = letture.f3;
      if (letture.gen !== undefined) document.getElementById('genPrec').value = letture.gen;

      caricaStorico();
    });

    function calcolaERagruppa() {
      const importo = parseFloat(document.getElementById('importoBolletta').value);
      const periodo = document.getElementById('periodo').value || 'N.D.';
      const iban = document.getElementById('iban').value.trim();
      
      if (iban) localStorage.setItem('ibanAcqua', iban);

      const genPrec = parseFloat(document.getElementById('genPrec').value) || 0;
      const genAtt = parseFloat(document.getElementById('genAtt').value) || 0;
      const consGen = genAtt > genPrec ? genAtt - genPrec : 0;

      const nomeF1 = document.getElementById('nomeF1').value;
      const f1P = parseFloat(document.getElementById('f1Prec').value) || 0;
      const f1A = parseFloat(document.getElementById('f1Att').value) || 0;
      const f1 = f1A - f1P;

      const nomeF2 = document.getElementById('nomeF2').value;
      const f2P = parseFloat(document.getElementById('f2Prec').value) || 0;
      const f2A = parseFloat(document.getElementById('f2Att').value) || 0;
      const f2 = f2A - f2P;

      const nomeF3 = document.getElementById('nomeF3').value;
      const f3P = parseFloat(document.getElementById('f3Prec').value) || 0;
      const f3A = parseFloat(document.getElementById('f3Att').value) || 0;
      const f3 = f3A - f3P;

      const totaleSotto = f1 + f2 + f3;

      if (!importo || totaleSotto <= 0) {
        alert("Inserisci un importo valido e assicurati che la somma dei consumi sia maggiore di zero.");
        return;
      }

      const q1 = (f1 / totaleSotto) * importo;
      const q2 = (f2 / totaleSotto) * importo;
      const q3 = (f3 / totaleSotto) * importo;

      ultimoCalcolo = { 
        periodo, importo, iban, consGen, genPrec, genAtt,
        nomeF1, f1P, f1A, f1, q1,
        nomeF2, f2P, f2A, f2, q2,
        nomeF3, f3P, f3A, f3, q3,
        totaleSotto 
      };

      document.getElementById('resPeriodo').innerText = `(${periodo})`;
      document.getElementById('resDifferenza').innerText = `Consumo totale sotto-contatori: ${totaleSotto} m³ ${consGen ? '| Generale: ' + consGen + ' m³' : ''}`;
      
      const lista = document.getElementById('listaQuote');
      lista.innerHTML = `
        <li class="flex justify-between border-b pb-1"><span>${nomeF1} (${f1} m³):</span> <strong>€ ${q1.toFixed(2)}</strong></li>
        <li class="flex justify-between border-b pb-1"><span>${nomeF2} (${f2} m³):</span> <strong>€ ${q2.toFixed(2)}</strong></li>
        <li class="flex justify-between border-b pb-1"><span>${nomeF3} (${f3} m³):</span> <strong>€ ${q3.toFixed(2)}</strong></li>
        <li class="flex justify-between font-bold pt-1 text-base text-gray-800"><span>Totale Bolletta:</span> <span>€ ${importo.toFixed(2)}</span></li>
      `;

      document.getElementById('areaRisultato').classList.remove('hidden');

      const record = { 
        id: Date.now(),
        data: new Date().toLocaleDateString(), 
        periodo, importo, 
        nomeF1, q1, 
        nomeF2, q2, 
        nomeF3, q3 
      };
      salvaInStorico(record);
      caricaStorico();

      // Richiesta di conferma per salvare le letture per la volta successiva
      setTimeout(() => {
        if (confirm("Vuoi salvare queste Letture Attuali per usarle automaticamente come 'Letture Precedenti' nella prossima bolletta?")) {
          
          const lettureDaSalvare = {
            gen: genAtt,
            f1: f1A,
            f2: f2A,
            f3: f3A
          };
          localStorage.setItem('lettureAcqua', JSON.stringify(lettureDaSalvare));
          
          // Aggiorna visivamente i campi spostando le letture
          document.getElementById('genPrec').value = genAtt;
          document.getElementById('f1Prec').value = f1A;
          document.getElementById('f2Prec').value = f2A;
          document.getElementById('f3Prec').value = f3A;
          
          // Svuota le letture attuali per non confondersi
          document.getElementById('genAtt').value = '';
          document.getElementById('f1Att').value = '';
          document.getElementById('f2Att').value = '';
          document.getElementById('f3Att').value = '';
        }
      }, 400); // Leggero ritardo per far apparire prima il risultato a schermo
    }

    function condividiWhatsApp(dettagliato = true) {
      if (!ultimoCalcolo) return;
      const c = ultimoCalcolo;
      let testo = "";

      if (dettagliato) {
        testo = `💧 *RIPARTIZIONE BOLLETTA ACQUA* (${c.periodo})\n\n` +
          `💰 *Importo Bolletta:* € ${c.importo.toFixed(2)}\n`;
        if (c.consGen > 0) testo += `🌐 *Contatore Generale:* ${c.genAtt} - ${c.genPrec} = *${c.consGen} m³*\n`;
        
        testo += `📊 *Totale rilevato dai sotto-contatori:* ${c.totaleSotto} m³\n\n` +
          `📌 *DETTAGLIO LETTURE E QUOTE:*\n\n` +
          `🔹 *${c.nomeF1}*\n• Lettura: ${c.f1A} - ${c.f1P} = ${c.f1} m³\n• Quota da pagare: *€ ${c.q1.toFixed(2)}*\n\n` +
          `🔹 *${c.nomeF2}*\n• Lettura: ${c.f2A} - ${c.f2P} = ${c.f2} m³\n• Quota da pagare: *€ ${c.q2.toFixed(2)}*\n\n` +
          `🔹 *${c.nomeF3}*\n• Lettura: ${c.f3A} - ${c.f3P} = ${c.f3} m³\n• Quota da pagare: *€ ${c.q3.toFixed(2)}*\n`;
      } else {
        testo = `💧 *Ripartizione Bolletta Acqua* (${c.periodo})\n\n` +
          `💰 *Totale Bolletta:* € ${c.importo.toFixed(2)}\n` +
          `📊 *Consumo Totale:* ${c.totaleSotto} m³\n\n` +
          `*Dettaglio Quote:*\n` +
          `• *${c.nomeF1}:* € ${c.q1.toFixed(2)} (${c.f1} m³)\n` +
          `• *${c.nomeF2}:* € ${c.q2.toFixed(2)} (${c.f2} m³)\n` +
          `• *${c.nomeF3}:* € ${c.q3.toFixed(2)} (${c.f3} m³)\n`;
      }

      if (c.iban) testo += `\n🏦 *IBAN per Bonifico:* ${c.iban}\n`;
      testo += `\n_Messaggio generato automaticamente._`;

      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(testo)}`, '_blank');
    }

    function salvaInStorico(record) {
      let storico = JSON.parse(localStorage.getItem('storicoAcqua') || '[]');
      storico.unshift(record);
      localStorage.setItem('storicoAcqua', JSON.stringify(storico));
    }

    function caricaStorico() {
      let storico = JSON.parse(localStorage.getItem('storicoAcqua') || '[]');
      const container = document.getElementById('listaStorico');
      if (storico.length === 0) {
        container.innerHTML = '<p class="text-xs text-gray-400">Nessun calcolo in archivio.</p>';
        return;
      }
      container.innerHTML = storico.map(item => `
        <div class="p-2 bg-gray-50 border rounded text-xs flex justify-between items-center">
          <div>
            <strong>${item.periodo}</strong> (${item.data}) - Tot: €${item.importo.toFixed(2)}
            <br>${item.nomeF1}: €${item.q1.toFixed(2)} | ${item.nomeF2}: €${item.q2.toFixed(2)} | ${item.nomeF3}: €${item.q3.toFixed(2)}
          </div>
          <button onclick="eliminaElementoStorico(${item.id})" class="text-red-500 hover:text-red-700 font-bold px-2 py-1 text-sm" title="Elimina">
            🗑️
          </button>
        </div>
      `).join('');
    }

    function eliminaElementoStorico(id) {
      let storico = JSON.parse(localStorage.getItem('storicoAcqua') || '[]');
      storico = storico.filter(item => item.id !== id);
      localStorage.setItem('storicoAcqua', JSON.stringify(storico));
      caricaStorico();
    }

    function cancellaTuttoStorico() {
      if (confirm("Sei sicuro di voler cancellare interamente lo storico dei calcoli?")) {
        localStorage.removeItem('storicoAcqua');
        caricaStorico();
      }
    }

    function scaricaPDF() {
      const { jsPDF } = window.jspdf;
      const elemento = document.getElementById('contenutoPDF');
      
      html2canvas(elemento).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        const pdf = new jsPDF('p', 'mm', 'a4');
        const width = pdf.internal.pageSize.getWidth();
        pdf.addImage(imgData, 'PNG', 10, 10, width - 20, 0);
        pdf.save(`Ripartizione_Acqua_${document.getElementById('periodo').value || 'Report'}.pdf`);
      });
    }
  </script>
</body>
</html>
